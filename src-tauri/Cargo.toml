[package]
name = "x-knowledge-base"
version = "0.1.0"
description = "A local-first X likes knowledge base"
authors = ["X Knowledge Base contributors"]
edition = "2021"
rust-version = "1.89"

[lib]
name = "x_knowledge_base_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "x-knowledge-base"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
async-trait = "0.1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
data-encoding = "2"
humantime = "2"
iroh = "1.3"
iroh-mdns-address-lookup = "0.6"
n0-future = "0.3"
postcard = { version = "1", features = ["use-std"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.9"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing = "0.1"
url = "2"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "zstd"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-barcode-scanner = "2"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
debug = "line-tables-only"
