<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2d27"/>
      <stop offset="1" stop-color="#151613"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbf8"/>
      <stop offset="1" stop-color="#e9eae4"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c09f"/>
      <stop offset="1" stop-color="#7f9876"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>

  <!-- Archived cards behind -->
  <g filter="url(#shadow)">
    <rect x="132" y="118" width="248" height="290" rx="30" fill="#4f654b" transform="rotate(-13 256 263)"/>
    <rect x="132" y="118" width="248" height="290" rx="30" fill="#6f8669" transform="rotate(8 256 263)"/>
  </g>

  <!-- Front post card -->
  <g filter="url(#shadow)">
    <rect x="124" y="122" width="264" height="292" rx="30" fill="url(#card)"/>
  </g>

  <!-- Author row -->
  <circle cx="170" cy="174" r="20" fill="#4f654b"/>
  <rect x="202" y="160" width="96" height="12" rx="6" fill="#22231f" opacity="0.85"/>
  <rect x="202" y="180" width="64" height="10" rx="5" fill="#92958d"/>

  <!-- Post text -->
  <rect x="150" y="222" width="150" height="12" rx="6" fill="#6c6e67"/>
  <rect x="150" y="246" width="188" height="12" rx="6" fill="#6c6e67"/>
  <rect x="150" y="270" width="140" height="12" rx="6" fill="#6c6e67"/>

  <!-- Liked heart -->
  <path d="M176 374c-3 0-30-17-30-36 0-10 8-17 17-17 6 0 10 3 13 7 3-4 7-7 13-7 9 0 17 7 17 17 0 19-27 36-30 36z" fill="#c4574c"/>
  <rect x="222" y="344" width="58" height="10" rx="5" fill="#92958d"/>

  <!-- Playlist bookmark ribbon -->
  <path d="M320 104h44a8 8 0 0 1 8 8v112l-30-22-30 22V112a8 8 0 0 1 8-8z" fill="url(#ribbon)" filter="url(#shadow)"/>
</svg>
